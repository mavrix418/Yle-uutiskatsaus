<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827"><title>Aamukatsaus</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#101827;color:#f8fafc;margin:0}main{max-width:650px;margin:auto;padding:28px 20px}h1{font-size:2.1rem}p,small{color:#bac6d5}button{background:#dceafe;color:#10213b;border:0;border-radius:12px;padding:14px 16px;font-size:1rem;font-weight:650;margin:5px 4px 5px 0}button:disabled{opacity:.4}article{background:#1d2a3d;border-radius:16px;padding:20px;margin:18px 0}a{color:#a9d2ff}#status{margin:16px 0}#more{white-space:pre-wrap;line-height:1.6}</style></head><body><main><h1>📻 Aamukatsaus</h1><p>Ylen tärkeimmät uutiset viimeiseltä 24 tunnilta</p><p id="status">Ladataan uutisia…</p><button id="play">▶ Kuuntele</button><button id="pause">⏸ Tauko</button><button id="morebtn">Kerro lisää</button><button id="refresh">↻ Tarkista päivitys</button><article><h2 id="headline">Uutislähetys</h2><p id="script"></p><div id="more"></div><p><a id="source" target="_blank" rel="noopener">Lue alkuperäinen uutinen Yleltä</a></p></article><small>Tiivistelmät ovat tekoälyn laatimia Ylen RSS-tietojen perusteella. Tarkista tärkeät tiedot alkuperäisestä lähteestä.</small></main><script>
let stories=[],index=0,mode='news',playing=false,paused=false,run=0;const $=id=>document.getElementById(id),synth=window.speechSynthesis;
function show(){let s=stories[index];if(!s)return;$('headline').textContent=`${index+1}/${stories.length}: ${s.title}`;$('script').textContent=s.script;$('source').href=s.url;$('more').textContent=mode==='more'?s.more:'';}
function speak(text,done){const token=run;const u=new SpeechSynthesisUtterance(text);u.lang='fi-FI';u.rate=.95;u.onend=()=>{if(token===run&&playing&&!paused)done?.()};u.onerror=()=>{playing=false;$('status').textContent='Puhe keskeytyi. Kokeile uudelleen.'};synth.speak(u)}
function next(){if(!playing||paused)return;if(index>=stories.length){playing=false;$('status').textContent='Lähetys päättyi';return}mode='news';show();$('status').textContent='Toistetaan uutista '+(index+1)+'/'+stories.length;speak(stories[index].script,()=>{index++;next()})}
function stop(){run++;synth.cancel();playing=false;paused=false}
$('play').onclick=()=>{if(!stories.length)return;if(paused){paused=false;playing=true;synth.resume();return}stop();if(index>=stories.length)index=0;playing=true;next()};
$('pause').onclick=()=>{if(playing&&!paused){synth.pause();paused=true;$('status').textContent='Tauolla'}else if(paused){synth.resume();paused=false;$('status').textContent='Jatketaan'}};
$('morebtn').onclick=()=>{if(!stories.length)return;stop();mode='more';show();playing=true;$('status').textContent='Lisätietoa uutisesta';speak(stories[index].more||'Lisätietoja ei ole saatavilla.',()=>{playing=false;$('status').textContent='Jatka lähetystä Kuuntele-painikkeella'})};
async function load(){stop();$('status').textContent='Haetaan uusinta lähetystä…';try{const r=await fetch('./news.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Lähetystä ei vielä ole');const data=await r.json();stories=data.stories||[];index=0;mode='news';show();$('status').textContent=`${stories.length} uutista · Päivitetty ${new Date(data.generated).toLocaleString('fi-FI')}`;}catch(e){$('status').textContent='Uutislähetystä ei vielä ole. Käynnistä GitHub Actionsin Päivitä uutiset -työnkulku.'}}
$('refresh').onclick=load;load();
</script></body></html>
